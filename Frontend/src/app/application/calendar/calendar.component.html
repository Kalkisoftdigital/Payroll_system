<app-nav-bar></app-nav-bar>
<div class="main-wrapper mt-5">
  <div class="page-wrapper">
    <div class="content container-fluid">
      <div class="row">
        <!-- Header with Add Event Button -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="fw-bold">Calendar</h4>
          <button *ngIf="isEditable" class="btn btn-primary btn-sm" (click)="openAddEventModal()">
            + Add Event
          </button>
        </div>

        <!-- Sidebar Filters -->
        <div class="col-md-3 col-lg-3 col-xl-2 mt-3">
          <div class="card shadow-sm">
            <div class="card-body">
              <h6 class="fw-bold mb-3">Event Categories</h6>
              <ul class="list-unstyled">
                <li class="filter-row" (click)="filterEventsByCategory('Holiday')">
                  <i class="ti ti-point-filled text-success me-2"></i> Holidays
                </li>
                <li class="filter-row" (click)="filterEventsByCategory('Meeting')">
                  <i class="ti ti-point-filled text-danger me-2"></i> Meetings
                </li>
                <li class="filter-row" (click)="filterEventsByCategory('Interview')">
                  <i class="ti ti-point-filled text-warning me-2"></i> Interviews
                </li>
                <li class="filter-row" (click)="filterEventsByCategory('Training')">
                  <i class="ti ti-point-filled text-primary me-2"></i> Trainings
                </li>
                <li class="filter-row" (click)="filterEventsByCategory('Leave')">
                  <i class="ti ti-point-filled text-secondary me-2"></i> Leaves
                </li>
              </ul>
              <button class="btn btn-secondary btn-sm w-100 mt-3" (click)="loadAllEvents()">Show All</button>
            </div>
          </div>
        </div>

        <!-- Calendar -->
        <div class="col-md-9 col-lg-9 col-xl-10">
          <div class="card shadow-sm rounded-3">
            <div class="card-body">
              <full-calendar [options]="calendarOptions"></full-calendar>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Event Modal -->
  <div class="modal fade" id="add_event" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form (ngSubmit)="onSubmitAddEvent()" #addEventForm="ngForm">
          <div class="modal-header">
            <h5 class="modal-title">Add Event / Holiday</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Event Title</label>
              <input name="title" [(ngModel)]="addEventModel.title" required class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Category</label>
              <select name="category" [(ngModel)]="addEventModel.category"
                (change)="onCategoryChange(($any($event.target)).value)" class="form-select" required>
                <option value="Holiday">Holiday</option>
                <option value="Meeting">Meeting</option>
                <option value="Interview">Interview</option>
                <option value="Training">Training</option>
                <option value="Leave">Leave</option>
              </select>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">From Date</label>
                <input name="start_date" [(ngModel)]="addEventModel.start_date" type="date" class="form-control"
                  required />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">To Date</label>
                <input name="end_date" [(ngModel)]="addEventModel.end_date" type="date" class="form-control" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success w-100" [disabled]="!addEventForm.valid">
              Save Event
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>
