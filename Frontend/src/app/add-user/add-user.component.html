<app-nav-bar></app-nav-bar>

<div class="main-wrapper mt-5">
  <div class="page-wrapper">
    <div class="content d-flex justify-content-center align-items-center">

      <!-- Centered Card -->
      <div class="card shadow-sm rounded-3" style="width: 50%; min-width: 400px;">
        <div class="card-header">
          <h5 class="mb-0">Add New User</h5>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onSubmit()" #userForm="ngForm">

            <!-- Employee Dropdown -->
            <div class="mb-3">
              <label class="form-label">Employee</label>
              <select class="form-control" [(ngModel)]="user.employee_id" name="employee"
                (ngModelChange)="onEmployeeChange($event)">
                <option [ngValue]="null" disabled selected>-- Select Employee --</option>
                <option *ngFor="let emp of employees" [value]="emp.id">
                  {{ emp.firstname }} {{ emp.lastName }}
                </option>
              </select>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" [(ngModel)]="user.email" name="email" placeholder="Enter email">
            </div>


            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" [(ngModel)]="user.password" name="password"
                placeholder="Enter password" required>
            </div>

            <!-- Role -->
            <div class="mb-3">
              <label class="form-label">Role</label>
              <select class="form-control" [(ngModel)]="user.role_id" name="role_id" required>
                <option [value]="0">Select Role</option>
                <option [value]="1">Super Admin</option>
                <option [value]="2">Admin</option>
                <option [value]="3">Manager</option>
                <option [value]="4">Employees</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Avatar</label>

              <input *ngIf="user.avatarUrl" type="text" class="form-control mb-2" [(ngModel)]="user.avatarUrl"
                name="avatarUrl" readonly>

              <input *ngIf="!user.avatarUrl" type="file" class="form-control" (change)="onFileSelected($event)">

              <div class="mt-3" *ngIf="user.avatarUrl">
                <label>Preview</label><br>
                <img [src]="user.avatarUrl" alt="Employee Avatar" class="img-thumbnail" width="120" height="120">
              </div>

            </div>

            <!-- Buttons -->
            <div class="text-end mt-3">
              <button type="submit" class="btn btn-success" [disabled]="!userForm.form.valid">
                Save
              </button>
              <button type="button" class="btn btn-secondary ms-2" routerLink="/users">
                Cancel
              </button>
            </div>

          </form>
        </div>
      </div>
      <!-- End Card -->

    </div>
  </div>
</div>
