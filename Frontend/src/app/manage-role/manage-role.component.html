<app-nav-bar></app-nav-bar>

<div class="main-wrapper mt-5">
  <div class="page-wrapper">
    <div class="content">

      <!-- Heading + Add Role Button -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Manage Roles</h4>
        <button class="btn btn-primary" (click)="openForm()">
          <i class="ti ti-user-plus me-1"></i> Add Role
        </button>
      </div>


      <!-- Roles List Card -->
      <div class="card shadow-sm mb-3" [ngClass]="{'opacity-50': showForm}">
        <div class="card-body">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>Role Name</th>
                <th>Description</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let role of roles">
                <!-- Role Name clickable to navigate to users of this role -->
                <td>
                  <a [routerLink]="['/roles', role.id, 'users']" class="text-decoration-none">
                    {{ role.roleName }}
                  </a>
                </td>
                <td>{{ role.description }}</td>
                <td>
                  <span [ngClass]="{'badge ': role.status=='active','badge bg-secondary': role.status=='inactive'}">
                    {{ role.status }}
                  </span>
                </td>
                <td>
                  <button class="btn btn-sm me-2" (click)="editRole(role)">
                    <i class="fa fa-edit"></i>
                  </button>
                  <button class="btn btn-sm" (click)="deleteRole(role.id!)">
                    <i class="fa fa-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>

          </table>
        </div>
      </div>

      <!-- Overlay Form Card -->
      <div *ngIf="showForm" class="form-overlay">
        <div class="form-card shadow">
          <h5>{{ editMode ? 'Edit Role' : 'Add Role' }}</h5>
          <form [formGroup]="roleForm" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">Role Name</label>
              <input formControlName="roleName" class="form-control" placeholder="Enter role name" />
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea formControlName="description" class="form-control" placeholder="Enter description"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select formControlName="status" class="form-select">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
            <div class="d-flex justify-content-end">
              <button type="submit" class="btn btn-primary me-2">{{ editMode ? 'Update' : 'Add' }}</button>
              <button type="button" class="btn btn-secondary" (click)="cancelForm()">Cancel</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
